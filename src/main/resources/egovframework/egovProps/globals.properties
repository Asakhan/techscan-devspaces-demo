#-----------------------------------------------------------------------
#   globals.properties : system-wide settings (eGovFrame convention)
#   The DB password is NOT stored here. Inject it via the DB_PASSWORD env var.
#-----------------------------------------------------------------------
Globals.DbType = h2
Globals.DriverClassName = org.h2.Driver
Globals.Url = jdbc:h2:mem:accountdb;MODE=Oracle;DB_CLOSE_DELAY=-1
Globals.UserName = ${DB_USER:sa}
Globals.Password = ${DB_PASSWORD:}
